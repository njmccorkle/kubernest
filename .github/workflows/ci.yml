name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: '!cancelled()'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      validate-title: ${{ github.event_name == 'pull_request' && (steps.filter.outputs.validate-title == 'true' || steps.filter.outputs.validate-title_count == '0') }}
      documentation: ${{ steps.filter.outputs.documentation }}
      actionlint: ${{ steps.filter.outputs.actionlint }}
      yamllint: ${{ steps.filter.outputs.yamllint }}
    steps:
      - name: Check out repository for push comparison
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify changed CI inputs
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            validate-title:
              - '**'
            documentation:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements-docs.txt'
              - '.github/workflows/ci.yml'
            actionlint:
              - '.github/workflows/**/*.yml'
              - '.github/workflows/**/*.yaml'
              - '.github/actionlint.yml'
              - '.github/actionlint.yaml'
            yamllint:
              - '**/*.yml'
              - '**/*.yaml'
              - '.yamllint'
              - 'requirements-ci.txt'

  validate-title:
    name: Validate PR title
    needs: changes
    if: needs.changes.outputs.validate-title == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  documentation:
    name: Build documentation
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: python -m mkdocs build --strict

  actionlint:
    name: Lint GitHub Actions
    needs: changes
    if: needs.changes.outputs.actionlint == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  yamllint:
    name: Lint YAML
    needs: changes
    if: needs.changes.outputs.yamllint == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Lint YAML files
        run: python -m yamllint --strict .

  required-checks:
    name: Required checks pass
    needs:
      - changes
      - validate-title
      - documentation
      - actionlint
      - yamllint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify applicable checks succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const expected = { changes: 'success' };
          for (const job of ['validate-title', 'documentation', 'actionlint', 'yamllint']) {
            const applicable = needs.changes.outputs[job];
            if (!['true', 'false'].includes(applicable)) {
              throw new Error(`Change detection did not return valid applicability for ${job}`);
            }
            expected[job] = applicable === 'true' ? 'success' : 'skipped';
          }
          for (const [job, result] of Object.entries(expected)) {
            if (needs[job].result !== result) {
              throw new Error(`${job}: expected ${result}, got ${needs[job].result}`);
            }
          }
          console.log('All applicable required checks passed.');
          NODE
