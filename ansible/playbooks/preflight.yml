---
- name: Validate k3s node readiness
  hosts: k3s_nodes
  gather_facts: true
  become: false
  tasks:
    - name: Confirm Ansible can reach each node
      ansible.builtin.ping:

    - name: Confirm supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is match("^24\\.04")
        fail_msg: "Preflight requires Ubuntu 24.04."

    - name: Confirm minimum CPU count
      ansible.builtin.assert:
        that:
          - (ansible_processor_vcpus | int) >= (k3s_min_vcpus | int)
        fail_msg: "Preflight requires at least {{ k3s_min_vcpus }} vCPUs."

    - name: Confirm minimum memory
      ansible.builtin.assert:
        that:
          - (ansible_memtotal_mb | int) >= (k3s_min_memory_mb | int)
        fail_msg: "Preflight requires at least {{ k3s_min_memory_mb }} MiB of guest-visible memory."

    - name: Confirm root filesystem capacity
      ansible.builtin.assert:
        that:
          - >-
            (ansible_mounts
            | selectattr('mount', 'equalto', '/')
            | map(attribute='size_total')
            | first
            | default(0)
            | int) >= (k3s_min_root_bytes | int)
        fail_msg: >-
          Preflight requires at least
          {{ ((k3s_min_root_bytes | int) / 1073741824) | int }} GiB of root
          filesystem capacity.
