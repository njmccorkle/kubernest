---
- name: Run non-mutating host preflight checks
  hosts: k3s_nodes
  gather_facts: true
  become: false
  tasks:
    - name: Confirm Ansible can reach each node
      ansible.builtin.ping:

    - name: Validate host prerequisites
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is match("^24\\.04")
          - (ansible_processor_vcpus | int) >= 2
          - (ansible_memtotal_mb | int) >= 3072
          - (root_usable_bytes | int) >= 42949672960
        fail_msg: >-
          Preflight failed: expected Ubuntu 24.04, at least 2 vCPUs,
          at least 3072 MB memory, and at least 42949672960 bytes
          of usable storage on /.
        success_msg: >-
          Preflight passed: SSH reachability and Ubuntu 24.04 CPU,
          memory, and root storage requirements are satisfied.
      vars:
        root_mount: >-
          {{
            (
              ansible_mounts
              | selectattr("mount", "equalto", "/")
              | list
              | first
            ) | default({})
          }}
        root_usable_bytes: >-
          {{
            root_mount.size_available
            | default(
              (root_mount.block_available | default(0) | int)
              * (root_mount.block_size | default(0) | int)
            )
            | int
          }}
