common_timezone: "UTC"
common_packages:
  - ca-certificates
  - curl
  - gnupg
  - apt-transport-https
  - iptables
  - open-iscsi
  - nfs-common
  - jq
  - chrony
k3s_min_root_bytes: 42949672960
k3s_modules:
  - overlay
  - br_netfilter
k3s_sysctl_settings:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
